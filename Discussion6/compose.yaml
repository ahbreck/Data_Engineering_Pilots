version: '3.9'

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_SERVER_NAME: ${PGADMIN_SERVER_NAME}
      PGADMIN_SERVER_HOST: ${PGADMIN_SERVER_HOST}
      PGADMIN_SERVER_PORT: ${PGADMIN_SERVER_PORT}
      PGADMIN_SERVER_DB: ${PGADMIN_SERVER_DB}
      PGADMIN_SERVER_USER: ${PGADMIN_SERVER_USER}
      PGADMIN_SERVER_PASSWORD: ${PGADMIN_SERVER_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_setup.sh:/docker-entrypoint-initdb.d/pgadmin_setup.sh:ro

volumes:
  postgres_data:
  pgadmin_data: