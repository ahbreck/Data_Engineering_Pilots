version: '3'

services:
  postgres:
    image: postgres:16
    container_name: postgres_ass5_reworked
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=master
    volumes:
      - ./postgres:/var/lib/postgresql/data/
    networks:
      - psql
    ports:
      - "5435:5432"

volumes:
  postgres:

networks:
  psql:
    driver: bridge
